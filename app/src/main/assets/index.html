
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>USA Snow Globe</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;color:#f0f8ff;
 font-family:Arial,sans-serif;
 background:radial-gradient(ellipse at 50% 35%,#164b83 0%,#081a39 55%,#020817 100%);
 min-height:100vh;overflow-x:hidden
}
header{text-align:center;padding:25px 12px 12px}
h1{font-size:27px;margin:0 0 8px;text-shadow:0 0 18px #56cfff}
header p{color:#b9dcff;margin:0;font-size:14px}


.globe:before{
 content:"";
 position:absolute;
 inset:0;
 z-index:2;
 border-radius:24px;
 pointer-events:none;
 background:
   linear-gradient(125deg,#ffffff20,transparent 28%),
   radial-gradient(ellipse at 50% 0%,#5bcfff20,transparent 70%);
 box-shadow:inset 0 0 35px #8be4ff18;
}

.globe:after{
 content:"";
 position:absolute;
 inset:-100% 0;
 z-index:3;
 pointer-events:none;
 background-image:
   radial-gradient(2px 2px at 15% 20%,#ffffffdd 98%,transparent),
   radial-gradient(3px 3px at 45% 60%,#c9f1ffdd 98%,transparent),
   radial-gradient(2px 2px at 75% 30%,#ffffffdd 98%,transparent),
   radial-gradient(2px 2px at 90% 80%,#d8f5ffdd 98%,transparent),
   radial-gradient(3px 3px at 30% 90%,#ffffffbb 98%,transparent);
 background-size:180px 180px;
 animation:snowfall 12s linear infinite;
 opacity:.75;
}

@keyframes snowfall{
 from{transform:translateY(-10%)}
 to{transform:translateY(35%)}
}

#map{
 position:relative;
 z-index:1;
 width:100%;
 height:auto;
 display:block;
 min-height:220px;
}


#map{width:100%;height:auto;display:block;min-height:220px}
.state{
 fill:#2675b4;stroke:#b5e8ff;stroke-width:.8;
 cursor:pointer;transition:fill .15s,filter .15s
}
.state:hover{fill:#71d8ff;filter:drop-shadow(0 0 5px #71d8ff)}
.state.selected{fill:#ffd166;filter:drop-shadow(0 0 8px #ffd166)}
.panel{
 margin:14px auto;padding:18px 14px;max-width:1000px;
 width:calc(100% - 20px);text-align:center;
 border:1px solid #75d6ff66;border-radius:18px;
 background:#10294ddd;box-shadow:0 0 20px #158bff22
}
#stateName{font-size:25px;font-weight:bold;color:#8fe4ff}
#details{margin-top:8px;color:#d6eaff;font-size:14px}
button{
 border:1px solid #8bdcff;background:#12558b;color:white;
 padding:12px 20px;border-radius:25px;font-size:15px;
 margin-top:14px;cursor:pointer
}
button:active{background:#247eb8}
#status{padding:15px;text-align:center;color:#b8d8f5;font-size:13px}
footer{text-align:center;padding:10px 12px 25px;color:#7eacd8;font-size:12px}
</style>
</head>
<body>
<header>
 <h1>❄️ USA Snow Globe 🇺🇸</h1>
 <p>Explore all 50 states in a glowing winter world</p>
</header>

<div class="globe">
 <svg id="map" viewBox="0 0 960 600"
      role="img" aria-label="Interactive map of the 50 United States">
   <text x="480" y="280" text-anchor="middle"
         fill="#d6eaff" font-size="20">Loading USA map...</text>
 </svg>
</div>

<div class="panel">
 <div id="stateName">Choose a state</div>
 <div id="details">Tap any state on the map to explore it.</div>
 <button id="reset">Reset selection</button>
</div>

<div id="status">Connecting to map data...</div>
<footer>50 states · Alaska and Hawaii included · USA Snow Globe</footer>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const stateNames={
"01":["Alabama","AL"],"02":["Alaska","AK"],
"04":["Arizona","AZ"],"05":["Arkansas","AR"],
"06":["California","CA"],"08":["Colorado","CO"],
"09":["Connecticut","CT"],"10":["Delaware","DE"],
"12":["Florida","FL"],"13":["Georgia","GA"],
"15":["Hawaii","HI"],"16":["Idaho","ID"],
"17":["Illinois","IL"],"18":["Indiana","IN"],
"19":["Iowa","IA"],"20":["Kansas","KS"],
"21":["Kentucky","KY"],"22":["Louisiana","LA"],
"23":["Maine","ME"],"24":["Maryland","MD"],
"25":["Massachusetts","MA"],"26":["Michigan","MI"],
"27":["Minnesota","MN"],"28":["Mississippi","MS"],
"29":["Missouri","MO"],"30":["Montana","MT"],
"31":["Nebraska","NE"],"32":["Nevada","NV"],
"33":["New Hampshire","NH"],"34":["New Jersey","NJ"],
"35":["New Mexico","NM"],"36":["New York","NY"],
"37":["North Carolina","NC"],"38":["North Dakota","ND"],
"39":["Ohio","OH"],"40":["Oklahoma","OK"],
"41":["Oregon","OR"],"42":["Pennsylvania","PA"],
"44":["Rhode Island","RI"],"45":["South Carolina","SC"],
"46":["South Dakota","SD"],"47":["Tennessee","TN"],
"48":["Texas","TX"],"49":["Utah","UT"],
"50":["Vermont","VT"],"51":["Virginia","VA"],
"53":["Washington","WA"],"54":["West Virginia","WV"],
"55":["Wisconsin","WI"],"56":["Wyoming","WY"]
};

const svg=d3.select("#map");
const status=document.getElementById("status");
const width=960,height=600;
let selected=null;

function showState(feature){
 const id=String(feature.id).padStart(2,"0");
 const info=stateNames[id];
 if(!info)return;

 selected=id;
 svg.selectAll(".state").classed("selected",
   d=>String(d.id).padStart(2,"0")===id);

 document.getElementById("stateName").textContent=info[0];
 document.getElementById("details").textContent=
   "State abbreviation: "+info[1]+" · Part of the United States";
}

function showError(){
 status.textContent=
 "Map data could not load. Check your internet connection and reopen the app.";
 svg.selectAll("text").remove();
 svg.append("text").attr("x",width/2).attr("y",height/2)
   .attr("text-anchor","middle").attr("fill","#ffffff")
   .attr("font-size",20).text("Map unavailable");
}

async function loadMap(){
 try{
  if(!window.d3||!window.topojson)throw Error("Libraries unavailable");

  const data=await d3.json(
   "https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json"
  );

  const features=topojson.feature(data,data.objects.states)
    .features.filter(d=>
      stateNames[String(d.id).padStart(2,"0")]
    );

  if(features.length!==50)throw Error("Incomplete state map");

  const projection=d3.geoAlbersUsa()
    .fitExtent([[18,18],[width-18,height-18]],{
      type:"FeatureCollection",features:features
    });

  const path=d3.geoPath(projection);

  svg.selectAll("*").remove();

  svg.append("defs").append("radialGradient")
    .attr("id","ocean")
    .selectAll("stop").data([
      {offset:"0%",color:"#174c80"},
      {offset:"100%",color:"#07152e"}
    ]).join("stop")
    .attr("offset",d=>d.offset)
    .attr("stop-color",d=>d.color);

  svg.append("rect")
    .attr("width",width).attr("height",height)
    .attr("rx",22).attr("fill","url(#ocean)");

  svg.append("g").selectAll("path")
    .data(features).join("path")
    .attr("class","state")
    .attr("d",path)
    .attr("aria-label",d=>
      stateNames[String(d.id).padStart(2,"0")][0])
    .on("click",(event,d)=>showState(d))
    .append("title")
    .text(d=>stateNames[String(d.id).padStart(2,"0")][0]);

  status.textContent=
    "Map ready · All 50 states · Tap a state to select it";
 }catch(error){
  console.error(error);
  showError();
 }
}

document.getElementById("reset").addEventListener("click",()=>{
 selected=null;
 svg.selectAll(".state").classed("selected",false);
 document.getElementById("stateName").textContent="Choose a state";
 document.getElementById("details").textContent=
   "Tap any state on the map to explore it.";
});

loadMap();
</script>
</body>
</html>
